<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Republic of the Philippines brand guidelines, section 04:
         Figtree speaks (display, semibold & bold only), Inter works (body and
         interface), JetBrains Mono labels (metadata only, never sentences). -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Site-wide defaults. The Worker (src/worker/seo.ts) rewrites the
         title, description, canonical, and og:* values per route at the
         edge, so crawlers and social scrapers — which don't run JS — see
         page-specific metadata. The client keeps document.title in sync
         during SPA navigation (RouteMeta in App.tsx). -->
    <title>Philippine National Budget — GAA FY 2020–2026 & NEP FY 2027 · BetterGov Budget</title>
    <meta name="description" content="The Philippine national budget, visualized and browsable: the enacted GAA for FY 2020–2026 and the FY 2027 NEP proposal, drillable from national totals down to individual line items." />
    <link rel="canonical" href="https://budget.bettergov.ph/" />
    <meta name="theme-color" content="#0b4fd9" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BetterGov Budget" />
    <meta property="og:title" content="Philippine National Budget — GAA FY 2020–2026 & NEP FY 2027 · BetterGov Budget" />
    <meta property="og:description" content="The Philippine national budget, visualized and browsable: the enacted GAA for FY 2020–2026 and the FY 2027 NEP proposal, drillable from national totals down to individual line items." />
    <meta property="og:url" content="https://budget.bettergov.ph/" />
    <meta property="og:image" content="https://budget.bettergov.ph/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Philippine national budget, FY 2020–2027 — BetterGov Budget" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
